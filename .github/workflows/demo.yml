name: Deploy public SDK example
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release artifact to demonstrate
        required: true
        default: v0.3.1
permissions:
  contents: read
concurrency:
  group: sdk-example-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Download and verify the published archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)) throw new Error('Select a version release tag');
          NODE
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --pattern '*SHA256SUMS.txt' --pattern '*manifest.json' --dir artifacts
          cd artifacts
          sha256sum --check *SHA256SUMS.txt
      - name: Build the example against that verified release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd examples/vanilla-todo
          VERSION="${RELEASE_TAG#v}"
          npm install --ignore-scripts "../../artifacts/sovereign-local-core-$VERSION.tgz"
          npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: examples/vanilla-todo/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
