name: Verify and publish NPM package
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NPM (requires a matching version tag and NPM authorization)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      archive: ${{ steps.package.outputs.archive }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require the version tag for a real publication
        if: inputs.publish
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF !== `refs/tags/v${version}`) throw new Error('Dispatch publication against the matching v<version> tag, not main');
          NODE
      - name: Install the tested native toolchain
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk-main
          .tools/emsdk-main/emsdk install 6.0.11
          .tools/emsdk-main/emsdk activate 6.0.11
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Verify source and the actual installed package
        run: |
          source .tools/emsdk-main/emsdk_env.sh
          npm test
          npm run test:browser
          npm run test:dx
          npm run check:release
      - name: Inspect the final tested archive without executing it
        id: package
        run: node scripts/verify-package.mjs
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Validate registry packaging without publishing
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npm publish "./artifacts/$ARCHIVE" --dry-run --access public --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: |
            artifacts/*.tgz
            artifacts/package-verification.json
          if-no-files-found: error
  attest:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: artifacts
      - name: Check the tested artifact before attestation
        env:
          ARCHIVE: ${{ needs.verify.outputs.archive }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          printf '%s  artifacts/%s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check
      - name: Attest the verified build (independent of NPM authentication)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ needs.verify.outputs.archive }}
  publish:
    if: inputs.publish
    needs: [verify, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: artifacts
      - name: Use the pinned OIDC-capable NPM CLI
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Verify the archive from the successful test job
        env:
          ARCHIVE: ${{ needs.verify.outputs.archive }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const bytes = readFileSync(`artifacts/${process.env.ARCHIVE}`);
          if (createHash('sha256').update(bytes).digest('hex') !== process.env.EXPECTED_SHA256) throw new Error('Archive digest mismatch');
          NODE
      - name: Publish with provenance (OIDC; optional token for first publication)
        env:
          ARCHIVE: ${{ needs.verify.outputs.archive }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./artifacts/$ARCHIVE" --provenance --access public --ignore-scripts
      - name: Inspect registry integrity and provenance
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: npm view "sovereign-local-core@$VERSION" version dist.integrity dist.attestations --json
